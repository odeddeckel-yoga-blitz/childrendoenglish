name: Spotlight daily

# Daily keep-or-swap loop (was hourly until 2026-10-18 — every rule is in days
# (14d tenure, 7d no-traffic, 30d cooldown) and each run wakes the Neon compute;
# file name kept so links/docs stay valid) for the home "Today's picks" (tools/spotlight/hourly.mjs).
# Needs the DATABASE_URL repo secret (Neon); without it the script exits 0 and
# does nothing. Commits only when the snapshot/spotlight/flags changed, which
# triggers CI + the Vercel deploy that rotates the cards.
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC ≈ 06:17 Israel — cards rotate before the school day
  workflow_dispatch:
    inputs:
      force_optimizer:
        description: 'Run the engagement optimizer + refresh the snapshot even below the traffic bar'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spotlight-hourly
  cancel-in-progress: false

jobs:
  spotlight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --omit=dev --ignore-scripts
      - name: Decide keep/swap
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_OPTIMIZER: ${{ inputs.force_optimizer == true && '1' || '0' }}
        run: node tools/spotlight/hourly.mjs
      - name: Commit if changed
        run: |
          git add -A -- src/data/spotlight.json src/data/cde-stats.json tools/spotlight/
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "spotlight-bot"
          git config user.email "spotlight-bot@users.noreply.github.com"
          git commit -m "spotlight: daily keep/swap ($(date -u +%Y-%m-%dT%H:%MZ))"
          git pull --rebase origin main
          git push origin HEAD:main
