name: CI

# Docs/notes-only commits skip CI; a newer push cancels the older run on the same ref.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'plans/**'
      - 'docs/**'
      - '.recurring-*.jsonl'
      - 'tools/seo/snapshots/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'plans/**'
      - 'docs/**'
      - '.recurring-*.jsonl'
      - 'tools/seo/snapshots/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest became 26.04 on 10-31 and Playwright 1.58 has no chromium build for it
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Game-kit drift check
        run: node scripts/sync-game-kit.mjs --check

      - name: Test
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
        run: npx playwright test
